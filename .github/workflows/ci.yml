name: CI

on:
  # Ein Lauf je Commit. Bis 2026-11-01 stand hier push auf jeden Branch UND
  # pull_request: ein Commit auf einem Branch mit offenem PR startete zwei
  # Läufe mit verschiedener Concurrency-Gruppe (github.ref ist bei push
  # refs/heads/<branch>, beim PR refs/pull/<n>/merge), und beide standen in der
  # Prüfliste des PR (#222). Jetzt prüft der pull_request-Lauf jeden Branch mit
  # PR, und zwar den Stand NACH dem Merge in main, nicht nur die Spitze des
  # Branches; main selbst läuft über push.
  #
  # Folge: ein Branch ohne PR hat keinen Lauf, und ein PR mit Merge-Konflikt
  # bekommt keinen (GitHub legt dann keinen Merge-Stand an). Beides zeigt sich
  # im PR, nicht erst nach dem Merge. Für einen Branch ohne PR: workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of a pull request so pushes don't pile up,
# but NEVER on main. Every commit on main keeps its own complete run.
#
# Until 2026-10-01 this was one group per ref with cancel-in-progress for all
# of them. Two commits pushed on main within a few minutes meant the first
# run was cancelled, and a cancelled run shows as a red cross in the commit
# history: 8 of the 14 red commits among the newest 100 on main were
# cancellations, not failures (06.09. and 01.10.2026). On main the group is
# the commit's own SHA, so no other push can supersede it.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nur lesen. Dieser Lauf schreibt nichts in das Repository, und ein Fund in
# einer Action soll mit dem Token nichts anrichten können
# (tests/guards/workflows.test.ts).
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    # Ein Lauf dauert vier bis fünf Minuten (gemessen an den letzten 30 Läufen
    # auf main und PRs, höchstens 303 s). Die Grenze ist das Vierfache: ein
    # hängender Test hält den Runner sonst bis zur Standardgrenze von 360
    # Minuten (#222).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # The version lives in .nvmrc and nowhere else in the workflows
          # (audit.yml and e2e.yml read it the same way). It is the version
          # Vercel runs in production (engines in package.json, the Vercel
          # project setting) and the Docker image (node:24-alpine). Until
          # 06.10.2026 CI tested 22 while production ran 24, so what shipped
          # was never what was tested (audit M8). tests/guards/node-version.test.ts
          # fails when any of these places drifts.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Security-Audit finding H-2: the tree had 11 advisories (one critical)
      # that nothing was watching for. Gating on `high` keeps this actionable —
      # moderate findings in dev-only tooling shouldn't block a release, but
      # anything high or critical should be a decision, not a surprise.
      # Failures are fixed by bumping, or by an explicit `overrides` entry in
      # package.json with a comment saying why.
      #
      # Runs through scripts/audit-gate.mjs, which is `npm audit` at the same
      # `high` threshold, split by tree (20.10.2026): a finding in what ships
      # (`--omit=dev`) always fails, a finding only in a dev tool fails when a
      # patched version exists, and is reported without failing when none does
      # (GHSA-vfj7-8cjw-p6xm for `braces`: every version is affected, so there
      # was nothing to bump to and no override to write). No exception list.
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public placeholder values. The Supabase clients read these lazily at
          # runtime (every data page is force-dynamic, so nothing is prerendered
          # against them) — these just keep `next build` from tripping on missing
          # env on a clean runner. They are NOT secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # Messung, keine Schranke (#221): welche Zeilen und Zweige die Tests
  # erreichen, damit "genug getestet" kein Gefühl bleibt. Eigener Job neben
  # verify, damit der Lauf nicht länger wird und eine Messung nie einen PR rot
  # färbt: die Schritte dürfen scheitern (continue-on-error), der Job bleibt
  # grün. Ein Test, der kaputt ist, fängt verify ab. Eine Schwelle gibt es
  # bewusst nicht, erst ein Basiswert (docs/SETUP.md, "Testabdeckung").
  coverage:
    name: Testabdeckung (Messung, blockiert nicht)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests mit Messung
        continue-on-error: true
        run: npx vitest run --coverage

      # Die Tabelle je Verzeichnis steht danach in der Zusammenfassung des Laufs.
      - name: Tabelle je Verzeichnis
        if: always()
        continue-on-error: true
        run: node scripts/coverage-summary.mjs

      - name: Bericht sichern
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
