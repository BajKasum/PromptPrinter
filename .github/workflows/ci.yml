name: CI

on:
  # Every branch, not just main: since 23.09.2026 all work happens on a
  # feature branch that is merged into main only once it is green here.
  # Checking only main meant a branch's problems surfaced after the merge.
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on a branch or pull request so pushes don't pile up,
# but NEVER on main. Every commit on main keeps its own complete run.
#
# Until 2026-10-01 this was one group per ref with cancel-in-progress for all
# of them. Two commits pushed on main within a few minutes meant the first
# run was cancelled, and a cancelled run shows as a red cross in the commit
# history: 8 of the 14 red commits among the newest 100 on main were
# cancellations, not failures (06.09. and 01.10.2026). On main the group is
# the commit's own SHA, so no other push can supersede it.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the Docker image (node:22-alpine, see Dockerfile) and
          # .nvmrc, so CI, prod, and local dev all run the same major (QA
          # finding K-3). Was 20 while the image and package.json's `engines`
          # both say >=20.3/22 — three unpinned targets that happened to agree
          # by coincidence, not by anything enforcing it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Security-Audit finding H-2: the tree had 11 advisories (one critical)
      # that nothing was watching for. Gating on `high` keeps this actionable —
      # moderate findings in dev-only tooling shouldn't block a release, but
      # anything high or critical should be a decision, not a surprise.
      # Failures are fixed by bumping, or by an explicit `overrides` entry in
      # package.json with a comment saying why.
      #
      # Runs through scripts/audit-gate.mjs, which is `npm audit` at the same
      # `high` threshold plus a short, named, EXPIRING list of accepted findings
      # (04.10.2026: GHSA-vfj7-8cjw-p6xm for `braces` has no patched version at
      # all, so there was nothing to bump to and no override to write). Every
      # other high or critical finding fails exactly as before.
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public placeholder values. The Supabase clients read these lazily at
          # runtime (every data page is force-dynamic, so nothing is prerendered
          # against them) — these just keep `next build` from tripping on missing
          # env on a clean runner. They are NOT secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
