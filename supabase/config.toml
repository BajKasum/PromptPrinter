# Lokaler Supabase-Stack für die Ende-zu-Ende-Tests (Betriebs-Audit, M1/M2).
#
# Das ist KEINE Abbildung der Produktion, sondern der kleinste Stack, der die
# Tests tragen kann. Die Datenbank wird allein aus supabase/migrations/ gebaut:
# jeder Lauf beweist damit nebenbei, dass sich das Schema aus dem Repository
# nachbauen lässt (0001_init fehlt in der Migrationsliste der Produktions-DB,
# weil die Datei vor der Verfolgung von Hand eingespielt wurde).
#
# Gestartet wird mit `supabase start`, die Zugangsdaten liefert
# `supabase status -o env`. Es sind die öffentlich bekannten Demo-Schlüssel des
# lokalen Stacks, keine Geheimnisse. Ablauf und Gegenstück zur Produktion:
# docs/SETUP.md, Abschnitt "Ende-zu-Ende-Tests".

project_id = "PromptPrinter"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Wie Produktion (PostgreSQL 17.6, geprüft 05.10.2026).
major_version = 17

[db.migrations]
enabled = true

# Es gibt keine Seed-Datei: jeder Test legt sein Konto selbst an.
[db.seed]
enabled = false

# Wird gebraucht: Anhänge und Projektdateien liegen in Buckets, die die
# Migrationen anlegen.
[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Der Next-Server der Tests laeuft auf Port 3100 (e2e/support/env.ts). Ohne diesen
# Eintrag verwirft GoTrue das redirectTo der App und schickt die Mail-Links an die
# Site-URL, und der Reset-Test liefe gegen die falsche Adresse.
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_signup = true
# Keine Bestätigungsmail bei der Registrierung. Mit ihr bräuchte jeder Test ein
# Postfach. Produktion läuft laut Auth-Logs (06.10.2026) ebenfalls ohne: eine
# Registrierung wurde sofort eingeloggt. Die Mail des Passwort-Resets dagegen
# prüft e2e/password-reset.spec.ts über das lokale Postfach (Mailpit).
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"

# Die deutschen Mail-Vorlagen der Produktion. Dieselben Dateien fuegt man im
# Dashboard ein (docs/SETUP.md, "Auth-Mails"), lokal liest sie der Stack von hier.
# tests/guards/auth-mail-templates.test.ts haelt Datei, Betreff und Link fest.
[auth.email.template.confirmation]
subject = "Bestätige deine E-Mail-Adresse für PromptPrinter"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Passwort zurücksetzen bei PromptPrinter"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Bestätige deine neue E-Mail-Adresse"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Du wurdest zu PromptPrinter eingeladen"
content_path = "./supabase/templates/invite.html"

# Alles Weitere, was die App nicht nutzt, ist aus: weniger Container, kürzerer
# Start, weniger, was in der CI schiefgehen kann.
[realtime]
enabled = false

[studio]
enabled = false

# Das Postfach des Stacks (Mailpit, Web-Oberflaeche und API auf Port 54324). Mails,
# die Supabase Auth lokal verschickt, landen dort. e2e/support/mailbox.ts liest sie.
[local_smtp]
enabled = true
port = 54324

[edge_runtime]
enabled = false

[analytics]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false
