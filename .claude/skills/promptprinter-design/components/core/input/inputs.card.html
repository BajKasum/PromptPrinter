<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));padding:20px;box-sizing:border-box;}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Label, PasswordInput } = window.PromptPrinterDesignSystem_dfd779;
function Demo(){
  const field = {marginBottom:18};
  return (<div style={{maxWidth:420}}>
    <div style={field}><Label>Projekt-Name</Label><Input placeholder="Meine App-Idee…" /></div>
    <div style={field}><Label>Passwort</Label><PasswordInput placeholder="Passwort" defaultValue="geheim1234" /></div>
    <div style={field}><Label>Email (Fehler)</Label><Input error defaultValue="keine-email" /><div style={{marginTop:5,fontSize:12,color:"hsl(var(--destructive))"}}>Bitte eine gültige Email eingeben.</div></div>
    <div style={field}><Label>API-Schlüssel (deaktiviert)</Label><Input disabled defaultValue="••••••••••••••••" /></div>
    <div style={field}><Label>Idee beschreiben</Label><Textarea placeholder="Beschreibe deine Idee in ein paar Sätzen…" /></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
