<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));padding:20px;box-sizing:border-box;}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { ToolLogo, TOOL_VISUAL } = window.PromptPrinterDesignSystem_dfd779;
function Demo(){
  return (<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
    {Object.keys(TOOL_VISUAL).map(name => (
      <div key={name} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid hsl(var(--border))",borderRadius:10,padding:"8px 10px",background:"hsl(var(--surface))"}}>
        <span style={{height:28,width:28,flexShrink:0,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:TOOL_VISUAL[name].color+"1a"}}><ToolLogo name={name} size={16}/></span>
        <span style={{minWidth:0}}>
          <div style={{fontSize:12,fontWeight:500,color:"hsl(var(--foreground))",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{name}</div>
          <div style={{fontSize:10,color:"hsl(var(--muted-foreground))",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{TOOL_VISUAL[name].blurb}</div>
        </span>
      </div>
    ))}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
